# capcom as a Herdr plugin: one action that opens (or focuses) the TUI as an overlay.

id = "capcom"
name = "capcom"
version = "0.1.0"
description = "Mission control for stories, tasks, pull requests, CI and manual runs."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# `herdr plugin install` runs this first; it needs Rust (https://rustup.rs).
[[build]]
platforms = ["linux", "macos"]
command = ["bash", "scripts/install.sh"]

[[panes]]
id = "tui"
title = "capcom"
placement = "overlay"
command = ["sh", "-c", "PATH=\"$HOME/.local/bin:$HOME/.cargo/bin:$PATH\"; exec capcom-tui"]

[[actions]]
id = "open"
platforms = ["linux", "macos"]
title = "Open capcom"
description = "Open capcom as an overlay, or bring it to the front if it is already open in this workspace."
command = ["bash", "scripts/open.sh"]
