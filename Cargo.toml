[package]
name = "capcom"
version = "0.1.0"
edition = "2021"
description = "Mission control for story-driven work: local kanban boards, Claude Code skills and a live terminal board for tasks, draft PRs, CI and manual runs"
license = "MIT"
repository = "https://github.com/philals/mission-control-capcom"
readme = "README.md"
keywords = ["kanban", "tui", "jira", "github", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.89"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
jsonschema = { version = "0.30", default-features = false }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
