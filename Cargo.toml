[package]
name = "capcom"
version = "0.1.0"
edition = "2021"
description = "Local kanban boards for Jira stories"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
jsonschema = { version = "0.30", default-features = false }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
